name: CI

# Quality gate + a build for EVERY stage. Deploy lives in deploy.yml so that a
# failure here never publishes anything.
#
# There is deliberately no workflow-level NEXT_PUBLIC_SITE_URL. scripts/build.mjs
# resolves the origin per stage from env.config.mjs, and an explicit environment
# variable would override that for all three stages (see resolveEnv()), silently
# turning every build into a production build.
on:
  push:
    branches: [main, uat, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: Build (${{ matrix.stage }})
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      # A broken dev or uat build must not hide a working prod build, and vice
      # versa - report all three outcomes.
      fail-fast: false
      matrix:
        stage: [dev, uat, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Prints the resolved variables for this stage into the job log, so a
      # misconfigured canonical URL is visible without downloading artifacts.
      - name: Resolve ${{ matrix.stage }} environment
        run: node scripts/apply-env.mjs ${{ matrix.stage }} --no-write

      # Static export into ./out, then rss.xml and search.json, then the
      # built-in verification that ./out really matches this stage.
      - name: Build static site
        run: npm run build:${{ matrix.stage }}

      - name: Record stage outputs
        run: |
          {
            echo "### Build: \`${{ matrix.stage }}\`"
            echo ""
            echo "| file | check |"
            echo "| --- | --- |"
            echo "| out/robots.txt | \`$(head -c 120 out/robots.txt | tr '\n' ' ')\` |"
            echo "| out/sitemap.xml | \`$(grep -c '<loc>' out/sitemap.xml || true)\` URL(s) |"
            echo "| canonical | \`$(grep -o 'rel="canonical" href="[^"]*"' out/index.html | head -1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          # One artifact per stage: each contains different baked-in URLs, so
          # they must never share a name.
          name: static-site-${{ matrix.stage }}
          path: out
          retention-days: 7
          if-no-files-found: error

